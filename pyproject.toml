[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hearth-agent"
version = "0.1.0"
description = "A private, local AI assistant for your terminal. Powered by Ollama, with web search, file and shell tools."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilead Cosman", email = "gileadcosman@gmail.com" }]
requires-python = ">=3.10"
keywords = ["ai", "agent", "llm", "ollama", "cli", "local", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "ddgs>=9.0",
]

[project.urls]
Homepage = "https://github.com/OpenSourceJesus/hearth"
Issues = "https://github.com/OpenSourceJesus/hearth/issues"

[project.scripts]
hearth = "hearth_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hearth_agent"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
